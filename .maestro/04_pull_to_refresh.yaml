appId: com.gundogar.altiustubirmac
---

# Test: Pull to refresh reloads data
- launchApp
- assertVisible: "2.5 Alt/Ust Oranlari"

# Wait for initial load
- assertVisible:
    text: ".*mac bulundu.*"

# Pull to refresh
- swipe:
    direction: DOWN
    duration: 1000

# Data should still be visible after refresh
- assertVisible:
    text: ".*mac bulundu.*"
- assertVisible: "Alt"
- assertVisible: "Ust"
